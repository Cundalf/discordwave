services:
  radio-bot:
    # En el server: docker pull ghcr.io/cundalf/discordwave:latest && docker compose up -d
    image: ghcr.io/cundalf/discordwave:latest
    container_name: discordwave
    restart: unless-stopped
    env_file: .env
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
